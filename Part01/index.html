<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 第01回聽力</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;color:#183050;background:#f1f5fb;margin:0;line-height:1.6}header{padding:14px;background:#182e53;color:#fff;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}a{color:inherit}main{max-width:850px;margin:20px auto;padding:0 12px}.panel{border-radius:15px;background:white;border:1px solid #d7e2f2;padding:22px;margin-bottom:13px}h1{margin:0}button,select,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd8e8;background:white;cursor:pointer}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{padding:5px 9px;font-size:12px}.active{background:#2765c5;color:#fff}.correct{background:#d9f8e7}.wrong{background:#ffe1e6}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choices button{padding:16px;text-align:left;font-weight:800}.source{max-width:100%;height:auto;max-height:70vh;object-fit:contain}.audio{background:#eff5ff;border-radius:12px;padding:15px;margin:14px 0}audio{width:100%}.muted{color:#6b7c91;font-size:13px}.action{display:flex;justify-content:space-between;gap:10px;margin:16px 0}.notice{background:#fff6da;padding:12px;border-radius:10px}.feedback{background:#edf8f1;border:1px solid #acd8c1;padding:14px;border-radius:12px;margin:14px 0}details{margin-top:10px}summary{cursor:pointer}img{width:100%}@media(max-width:550px){.choices{grid-template-columns:1fr}.panel{padding:14px}.nav{max-height:130px;overflow:auto}}</style><header><b>🎧 TOEIC 多益聽力｜第一回</b><span><a href="../index.html">🏠 回首頁</a>　<a href="exam.html" onclick="event.preventDefault();alert('擬真試題尚未製作')">📝 擬真試題</a></span><label>代號 <input id="user" style="width:110px"></label><button id="save">儲存</button></header><main><div class="panel"><h1>TEST 01</h1><div id="score"></div><select id="filter"><option value="all">全部100題</option><option value="1">Part1　1～6</option><option value="2">Part2　7～31</option><option value="3">Part3　32～70</option><option value="4">Part4　71～100</option><option value="wrong">錯題專項練習</option><option value="marked">標記題目</option></select><div class="nav" id="nav"></div><button id="overview">查看錯題總覽</button><div id="wronglist"></div></div><div class="panel"><p id="part"></p><h2 id="title">第1題</h2><div id="photo" style="display:none"><img id="img" class="source" alt="題本圖片"></div><div class="audio"><b>🎵 播放 MP3</b><p class="muted" id="filename"></p><audio id="player" controls preload="none"></audio><div class="muted" id="audioerr"></div><select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div><p id="instruction"></p><div class="choices" id="choices"></div><div id="feedback"></div><div class="action"><button id="prev">←上一題</button><button id="mark">🔖 標記</button><button id="next">下一題→</button></div></div><p class="notice">請同時上傳 images 和 solutions 資料夾，才會顯示照片、試題及原稿解析。目前第71～76題缺兩組 MP3。</p></main><script>
const KEY="DBACABABCCACBBABACABBACABACACBCBCCBADBDBBDADBADCADABCDACBDCDBBCADCCADCCADBACBCCADBDDCABCACDABDABCABD",Q=Array.from({length:100},(_,i)=>{let n=i+1,p=n<=6?1:n<=31?2:n<=70?3:4,g=p<3?n:p===3?32+Math.floor((n-32)/3)*3:71+Math.floor((n-71)/3)*3,x=String(g).padStart(2,"0"),y=String(g+2).padStart(2,"0");return{n,p,g,correct:KEY[i],audio:"audio/Test01_"+(p<3?String(n).padStart(2,"0"):x+"-"+y)+".mp3",image:p===1?"images/q"+String(n).padStart(2,"0")+".jpg":p>=3?"images/group_"+x+"-"+y+".jpg":"",solution:p<3?"solutions/q"+String(n).padStart(2,"0")+".jpg":"solutions/group_"+x+"-"+y+".jpg"}});let n=1,part="all",user="",answers={},wrong={},marked={};const $=k=>document.getElementById(k);function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function k(t){return"listening01_"+(user||"local")+"_"+t}function load(){user=get("toeic_listening_user_code","");$("user").value=user;answers=get(k("answers"),{});wrong=get(k("wrong"),{});marked=get(k("marked"),{});render()}function save(){put(k("answers"),answers);put(k("wrong"),wrong);put(k("marked"),marked)}$("save").onclick=()=>{put("toeic_listening_user_code",$("user").value.trim());load()};function group(){return Q.filter(q=>part==="all"||part==="wrong"&&wrong[q.n]||part==="marked"&&marked[q.n]||part==q.p)}function render(){let a=group();if(!a.some(q=>q.n===n))n=(a[0]||Q[0]).n;let q=Q[n-1],v=answers[n];$("nav").innerHTML="";for(let t of a){let b=document.createElement("button");b.textContent=t.n;b.className=(t.n===n?"active ":"")+(answers[t.n]?answers[t.n]===t.correct?"correct":"wrong":"");b.onclick=()=>{n=t.n;render()};$("nav").appendChild(b)}$("score").textContent="已作答 "+Object.keys(answers).length+"/100　｜　錯題庫 "+Object.keys(wrong).filter(x=>wrong[x]).length;$("part").textContent="Part "+q.p+(q.p>=3?"｜題組 "+q.g+"～"+(q.g+2):"");$("title").textContent="第 "+n+" 題";$("instruction").textContent=q.p===1?"觀察照片，聆聽4個敘述，選最符合的選項。":q.p===2?"聆聽問題，選 A～C 適當回應。":"根據題本圖片中的第 "+n+" 題作答。";$("photo").style.display=q.image?"block":"none";if(q.image)$("img").src=q.image;$("filename").textContent=q.audio;$("player").src=q.audio;$("audioerr").textContent=n>=71&&n<=76?"⚠️ 此題組 MP3 尚未找到。":"";$("choices").innerHTML="";for(let c of"ABCD".slice(0,q.p===2?3:4)){let b=document.createElement("button");b.textContent="("+c+")";b.disabled=!!v&&part!=="wrong";if(v&&c===q.correct)b.className="correct";if(v&&c===v&&c!==q.correct)b.className="wrong";b.onclick=()=>answer(c);$("choices").appendChild(b)}$("feedback").innerHTML="";if(v&&part!=="wrong")show(v);$("mark").textContent=marked[n]?"取消標記":"🔖標記"}function show(v){let q=Q[n-1],d=document.createElement("div");d.className="feedback";d.innerHTML="<b>"+(v===q.correct?"✅ 回答正確":"❌ 回答錯誤")+"，正確答案："+q.correct+"</b><p>📖 原文・中文翻譯・🎯 詳細解析（原教材掃描）</p>";let details=document.createElement("details");details.open=true;let sm=document.createElement("summary");sm.textContent="檢視詳細解析與原稿";let img=document.createElement("img");img.loading="lazy";img.src=q.solution;img.alt="第"+n+"題原始解析影像（如未顯示請上傳solutions資料夾）";details.append(sm,img);d.appendChild(details);$("feedback").appendChild(d)}function answer(c){if(part==="wrong"){$("choices").querySelectorAll("button").forEach(b=>b.disabled=true);if(c!==Q[n-1].correct)wrong[n]=true;save();show(c);return}if(answers[n])return;answers[n]=c;if(c!==Q[n-1].correct)wrong[n]=true;save();render()}$("filter").onchange=e=>{part=e.target.value;n=(group()[0]||Q[0]).n;render()};$("mark").onclick=()=>{marked[n]=!marked[n];save();render()};$("prev").onclick=()=>{let a=group().map(q=>q.n);n=a[Math.max(0,a.indexOf(n)-1)]||1;render()};$("next").onclick=()=>{let a=group().map(q=>q.n);n=a[Math.min(a.length-1,a.indexOf(n)+1)]||100;render()};$("speed").onchange=()=>{$("player").playbackRate=Number($("speed").value)};$("player").onerror=()=>{$("audioerr").textContent="⚠️ MP3不存在或無法播放，請檢查 GitHub audio 檔名。"};$("overview").onclick=()=>{let list=$("wronglist");list.innerHTML="";for(let q of Q.filter(x=>wrong[x.n])){let d=document.createElement("p");d.textContent="第"+q.n+"題：原選"+(answers[q.n]||"重練")+"／正確"+q.correct+"　";let b=document.createElement("button");b.textContent="重練";b.onclick=()=>{part="wrong";$("filter").value=part;n=q.n;render()};let r=document.createElement("button");r.textContent="移除";r.onclick=()=>{delete wrong[q.n];save();$("overview").click();render()};d.append(b,r);list.appendChild(d)}};load();</script></html>
