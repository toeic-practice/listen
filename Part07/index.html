od question.\n(C) It was returned on June 4.","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":"這是確認這個月是否對清潔用品提供折扣的附加疑問句。","vocabulary":"offer [ˈɔfɚ] 提供；cleaning supplies 清潔用品；count [kaʊnt] 數；return [rɪˈtɝn] 退回"},{"id":24,"part":2,"group":24,"correct":"A","audio":"audio/Test07_24.mp3","image":"","stem":"Have we published more articles this year than last year?","options":{"A":"I haven't worked here long enough to say.","B":"The article is much too long.","C":"I thought you had edited it already."},"transcript":"Have we published more articles this year than last year?\n(A) I haven't worked here long enough to say.\n(B) The article is much too long.\n(C) I thought you had edited it already.","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":"這是確認今年發表的報導是否比去年多的助動詞（Have）疑問句。","vocabulary":"publish [ˈpʌblɪʃ] 發行；出版；article [ˈɑrtɪkḷ] 報導"},{"id":25,"part":2,"group":25,"correct":"B","audio":"audio/Test07_25.mp3","image":"","stem":"Could you tell Leslie to park in the lot next door?","options":{"A":"A bus is stuck in traffic.","B":"She doesn't have a car.","C":"The house next door is for sale."},"transcript":"Could you tell Leslie to park in the lot next door?\n(A) A bus is stuck in traffic.\n(B) She doesn't have a car.\n(C) The house next door is for sale.","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":"這是要求告訴 Leslie 停車在隔壁停車場的要求疑問句。應該要知道 Could you 是用來提出要求的句型。","vocabulary":"lot [lɑt] 停車場"},{"id":26,"part":2,"group":26,"correct":"C","audio":"audio/Test07_26.mp3","image":"","stem":"Who has agreed to travel to San Francisco for the medical convention?","options":{"A":"Well, only after the convention ended.","B":"The trip took almost five days.","C":"Isn't Dr. Kumar planning to go?"},"transcript":"Who has agreed to travel to San Francisco for the medical convention?\n(A) Well, only after the convention ended.\n(B) The trip took almost five days.\n(C) Isn't Dr. Kumar planning to go?","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":" ","stem":"此題原始文字資料待補","options":{},"transcript":"","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":"","vocabulary":""},{"id":31,"part":2,"group":31,"correct":"","audio":"audio/Test07_31.mp3","image":"","stem":"此題原始文字資料待補","options":{},"transcript":"","zhTranscript":"","zhQuestion":"","zhOptions":{},"analysis":"","vocabulary":""},{"id":32,"part":3,"group":32,"correct":"C","audio":"audio/Test07_32-34.mp3","image":"","stem":"What does the woman say an article is about?","options":{"A":"International trade laws","B":"Stock market performance","C":"Overseas production","D":"Marketing methods"},"transcript":"W: 32 I read an article this morning that was published in *Business Quarterly* magazine. It highlighted the fact that more companies are manufacturing TV screens abroad because doing so is much cheaper.\nM: Hmm . . . 33 That might create a problem for us if our competitors end up lowering their prices. If they do, I suppose we'll have to think of ways to encourage customers to buy our domestically produced goods.\nW: 34 What if we emphasize how our goods lead to more high-paying jobs in the United Kingdom? We could launch a marketing campaign about it.\nM: That's a great plan. I think consumers here would respond well to that message.","zhTranscript":"女： 32 我今天早上讀了在《Business Quarterly》雜誌的文章。它強調更多公司會在海外生產電視螢幕的事實，因為這樣做更便宜。\n男： 嗯……33 如果我們的競爭對手最後降低價格，那可能會對我們造成問題。如果他們這樣做，我想我們必須想辦法鼓勵消費者購買我們國內生產的商品。\n女： 34 如果我們強調我們的商品是如何在英國帶來更多的高薪工作？我們可以針對這點發起行銷活動。\n男： 那是很棒的計畫。我想這裡的消費者對這個訊息會有良好的回應。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問女子提到文章是關於什麼，所以要仔細聆聽女子表達中提到題目關鍵詞（article）的前後內容。女子說「I read an article ~. It highlighted the fact that more companies are manufacturing TV screens abroad because doing so is much cheaper.」，提到自己閱讀了文章強調更多的公司在國外生產電視螢幕的事實，因為這樣做更便宜，所以正確答案是 (C) Overseas production。","vocabulary":"highlight [ˈhaɪˌlaɪt] 強調；encourage [ɪnˈkɝɪdʒ] 鼓勵；domestically [dəˈmɛstɪklɪ] 在國內；emphasize [ˈɛmfəˌsaɪz] 強調；launch [lɔntʃ] 發起；stock market 股票市場；method [ˈmɛθəd] 方法；introduc e any other ideas then? 57 Last week, half of the bookings in the system just disappeared.\nM: If you've already placed a job posting and are not receiving many responses, maybe 58 we should contact programmers on freelancer Web sites directly.\nW: OK. 58 If you think it will help, I'll start working on that now.\nM: Great. I'll help you, too, since this is urgent.","zhTranscript":"女： 我目前在找可以改善我們餐廳訂位應用程式的程式設計師，但我很難找到對的人選。56 我可能會聯絡 VHD 技術人力服務尋求幫助。\n男： 56 你不記得上次我們使用那個服務時發生的事嗎？他們一直變更價格。\n女： 那你有其他想法嗎？57 上週，系統中一半的預訂就這樣消失了。\n男： 如果你已經貼出工作徵人啟事卻沒有收到很多回覆，也許58 我們應該直接聯絡接案網站上的程式設計師。\n女： 好的。58 如果你覺得這有幫助，我現在會開始處理。\n男： 好。我也會幫你，畢竟這很緊急。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問上週發生了什麼，所以要仔細聆聽提到題目關鍵詞（last week）的前後內容。女子說「Last week, half of the bookings in the system just disappeared.」，提到上週系統中一半的預訂就這樣消失了。由此可知，應用程式發生故障，所以正確答案是 (C) An application malfunctioned。","vocabulary":""},{"id":58,"part":3,"group":56,"correct":"C","audio":"audio/Test07_56-58.mp3","image":"","stem":"What will the woman most likely do next?","options":{"A":"Post an advertisement online","B":"Review a document","C":"Search for potential candidates","D":"Contact a coworker for help"},"transcript":"W: I'm currently looking for a programmer who can improve our restaurant reservation application, but I'm having trouble finding the right person. 56 I might contact VHD Tech Staffing Services for help.\nM: 56 Don't you remember what happened the last time we used that service? They kept changing their price.\nW: Do you have any other ideas then? 57 Last week, half of the bookings in the system just disappeared.\nM: If you've already placed a job posting and are not receiving many responses, maybe 58 we should contact programmers on freelancer Web sites directly.\nW: OK. 58 If you think it will help, I'll start working on that now.\nM: Great. I'll help you, too, since this is urgent.","zhTranscript":"女： 我目前在找可以改善我們餐廳訂位應用程式的程式設計師，但我很難找到對的人選。56 我可能會聯絡 VHD 技術人力服務尋求幫助。\n男： 56 你不記得上次我們使用那個服務時發生的事嗎？他們一直變更價格。\n女： 那你有其他想法嗎？57 上週，系統中一半的預訂就這樣消失了。\n男： 如果你已經貼出工作徵人啟事卻沒有收到很多回覆，也許58 我們應該直接聯絡接案網站上的程式設計師。\n女： 好的。58 如果你覺得這有幫助，我現在會開始處理。\n男： 好。我也會幫你，畢竟這很緊急。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問女子接下來最可能做什麼，所以要仔細聆聽對話的結尾內容。男子說「we should contact programmers on freelancer Web sites directly.」，提到應該直接聯絡接案網站上的程式設計師，女子隨即回答「If you think it will help, I'll start working on that now.」，表示如果這有幫助，自己現在會開始處理。由此可知，女子將搜尋潛在的應徵者，所以正確答案是 (C) Search for potential candidates。","vocabulary":""},{"id":59,"part":3,"group":59,"correct":"D","audio":"audio/Test07_59-61.mp3","image":"","stem":"Where does the man most likely work?","options":{"A":"In a supermarket","B":"In a café","C":"In a warehouse","D":"In a bakery"},"transcript":"M: Welcome to Paterson's Baked Goods! How can I help you?\nW1: It's my supervisor's birthday tomorrow, and she wants a strawberry cake. But she doesn't eat dairy.\nM: No problem. I can make one without any milk or butter. It won't be ready until tomorrow at 11 a.m., though. Is that OK?\nW1: Let me call a coworker quickly to check . . . Hello, Beth. When will the party for Ms. Larson be held?\nW2: Um, at 1 p.m. Once everyone returns from lunch.\nW1: Thanks . . . Uh, 11 a.m. is fine.\nM: Great. Would you like to pick it up? It can also be brought to your office for a $10 charge.\nW1: I'll come get it myself.","zhTranscript":"男： 歡迎光臨 Paterson 烘焙坊！有什麼能幫助您的？\n女一： 明天是我主管的生日，她想要草莓蛋糕。但是她不吃乳製品。\n男： 沒問題，我可以製作不含任何牛奶或奶油的。不過要到明天早上 11 點才會備好，這樣可以嗎？\n女一： 我打給同事確認一下……哈囉，Beth。明天為 Larson 女士的派對是什麼時候？\n女二： 嗯，在下午 1 點。一旦大家吃完午餐回來。\n女一： 謝謝……呃，早上 11 點可以。\n男： 好的。你要自己取貨嗎？也可以送蛋糕到您辦公室，收 10 元費用。\n女一： 我會自己來拿。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問男子的工作地點，聆聽時不要錯過與身份及職業有關的詞彙語句。男子說「Welcome to Paterson's Baked Goods!」，提到歡迎光臨 Paterson 烘焙坊，女一隨即回答「It's my supervisor's birthday tomorrow, and she wants a strawberry cake.」，提到明天是主管的生日，她想要草莓蛋糕。由此可知，男子的工作地點是烘焙坊，所以正確答案是 (D) In a bakery。","vocabulary":"bakery [ˈbekərɪ] 烘焙坊；dairy [ˈdɛrɪ] 乳製品；warehouse [ˈwɛrˌhaʊs] 倉庫；expedite [ˈɛkspəˌdaɪt] 加快；upgrade [ˈʌpˌɡred] 升級；deliver [dɪˈlɪvɚ] 運送"},{"id":60,"part":3,"group":59,"correct":"B","audio":"audio/Test07_59-61.mp3","image":"","stem":"What information does Beth provide?","options":{"A":"The location of an office","B":"The time of an event","C":"The name of a manager","D":"The amount of a charge"},"transcript":"M: Welcome to Paterson's Baked Goods! How can I help you?\nW1: It's my supervisor's birthday tomorrow, and she wants a strawberry cake. But she doesn't eat dairy.\nM: No problem. I can make one without any milk or butter. It won't be ready until tomorrow at 11 a.m., though. Is that OK?\nW1: Let me call a coworker quickly to check . . . Hello, Beth. When will the party for Ms. Larson be held?\nW2: Um, at 1 p.m. Once everyone returns from lunch.\nW1: Thanks . . . Uh, 11 a.m. is fine.\nM: Great. Would you like to pick it up? It can also be brought to your office for a $10 charge.\nW1: I'll come get it myself.","zhTranscript":"男： 歡迎光臨 Paterson 烘焙坊！有什麼能幫助您的？\n女一： 明天是我主管的生日，她想要草莓蛋糕。但是她不吃乳製品。\n男： 沒問題，我可以製作不含任何牛奶或奶油的。不過要到明天早上 11 點才會備好，這樣可以嗎？\n女一： 我打給同事確認一下……哈囉，Beth。明天為 Larson 女士的派對是什麼時候？\n女二： 嗯，在下午 1 點。一旦大家吃完午餐回來。\n女一： 謝謝……呃，早上 11 點可以。\n男： 好的。你要自己取貨嗎？也可以送蛋糕到您辦公室，收 10 元費用。\n女一： 我會自己來拿。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問 Beth 也就是女二提供什麼資訊，所以要仔細聆聽女二的表達內容。女一對女二 Beth 說「Hello, Beth. When will the party for Ms. Larson be held?」，詢問為 Larson 女士舉辦的派對是什麼時候，女二隨即回答「Um, at 1 p.m.」，提到是在下午 1 點，所以正確答案是 (B) The time of an event。","vocabulary":""},{"id":61,"part":3,"group":59,"correct":"D","audio":"audio/Test07_59-61.mp3","image":"","stem":"What does the man offer to do for an extra fee?","options":{"A":"Expedite an order","B":"Change a service","C":"Upgrade a product","D":"Deliver an item"},"transcript":"M: Welcome to Paterson's Baked Goods! How can I help you?\nW1: It's my supervisor's birthday tomorrow, and she wants a strawberry cake. But she doesn't eat dairy.\nM: No problem. I can make one without any milk or butter. It won't be ready until tomorrow at 11 a.m., though. Is that OK?\nW1: Let me call a coworker quickly to check . . . Hello, Beth. When will the party for Ms. Larson be held?\nW2: Um, at 1 p.m. Once everyone returns from lunch.\nW1: Thanks . . . Uh, 11 a.m. is fine.\nM: Great. Would you like to pick it up? It can also be brought to your office for a $10 charge.\nW1: I'll come get it myself.","zhTranscript":"男： 歡迎光臨 Paterson 烘焙坊！有什麼能幫助您的？\n女一： 明天是我主管的生日，她想要草莓蛋糕。但是她不吃乳製品。\n男： 沒問題，我可以製作不含任何牛奶或奶油的。不過要到明天早上 11 點才會備好，這樣可以嗎？\n女一： 我打給同事確認一下……哈囉，Beth。明天為 Larson 女士的派對是什麼時候？\n女二： 嗯，在下午 1 點。一旦大家吃完午餐回來。\n女一： 謝謝……呃，早上 11 點可以。\n男： 好的。你要自己取貨嗎？也可以送蛋糕到您辦公室，收 10 元費用。\n女一： 我會自己來拿。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問男子主動提出做什麼，所以要仔細聆聽男子表達中使用建議相關語句後面的內容。男子說「It can also be brought to your office for a $10 charge.」，提到也可以送蛋糕到對方的辦公室，收 10 元費用，所以正確答案是 (D) Deliver an item。","vocabulary":""},{"id":62,"part":3,"group":62,"correct":"A","audio":"audio/Test07_62-64.mp3","image":"images/62.jpg","stem":"What problem does the man mention?","options":{"A":"Some participants have not arrived.","B":"Some equipment was not installed.","C":"A room is occupied.","D":"An elevator is out of order."},"transcript":"M: Pardon me. 62 I'm supposed to participate in an orientation session organized by the human resources department. It should've started at 1:30 p.m., but it's 1:35 p.m. now, and 62 no one has arrived yet. That's the main conference room over there, right?\nW: Yes, it is. But, your meeting was moved to one of our other conference rooms.\nM: Oh, thanks. 63 I'm still settling in here since it's my first day of work. Can you tell me where I should go?\nW: Sure. 64 Head to the 14th floor. When you get off the elevator on that floor, go right. The meeting is taking place in the space directly across from the break room.","zhTranscript":"男： 不好意思，62 我應該要參加由人事部主辦的入職培訓。它應該在下午 1 點 30 分開始，但現在已經是下午 1 點 35 分了，而且62 還沒有人到場。是在那裡的主要會議室，對嗎？\n女： 是的，沒錯。但是，你的會議被移到我們其他會議室了。\n男： 哦，謝謝。63 因為這是我第一天上班，我還在適應這裡。可以請你告訴我應該往哪裡走？\n女： 沒問題。64 搭到 14 樓，出電梯後向右轉。會議就在休息室正對面的空間舉行。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問男子提到的問題，所以要仔細聆聽男子表達中使用否定或負面語句後面的內容。男子說「I'm supposed to participate in an orientation session」，提到自己要參加入職培訓，接著又說「no one has arrived yet」，提到還沒有人到場，所以正確答案是 (A) Some participants have not arrived。","vocabulary":"orientation [ˌɔrɪɛnˈteʃən] 入職培訓；settle in 適應；break room 休息室"},{"id":63,"part":3,"group":62,"correct":"B","audio":"audio/Test07_62-64.mp3","image":"images/62.jpg","stem":"Who most likely is the man?","options":{"A":"A senior manager","B":"A new employee","C":"A technician","D":"A receptionist"},"transcript":"M: Pardon me. 62 I'm supposed to participate in an orientation session organized by the human resources department. It should've started at 1:30 p.m., but it's 1:35 p.m. now, and 62 no one has arrived yet. That's the main conference room over there, right?\nW: Yes, it is. But, your meeting was moved to one of our other conference rooms.\nM: Oh, thanks. 63 I'm still settling in here since it's my first day of work. Can you tell me where I should go?\nW: Sure. 64 Head to the 14th floor. When you get off the elevator on that floor, go right. The meeting is taking place in the space directly across from the break room.","zhTranscript":"男： 不好意思，62 我應該要參加由人事部主辦的入職培訓。它應該在下午 1 點 30 分開始，但現在已經是下午 1 點 35 分了，而且62 還沒有人到場。是在那裡的主要會議室，對嗎？\n女： 是的，沒錯。但是，你的會議被移到我們其他會議室了。\n男： 哦，謝謝。63 因為這是我第一天上班，我還在適應這裡。可以請你告訴我應該往哪裡走？\n女： 沒問題。64 搭到 14 樓，出電梯後向右轉。會議就在休息室正對面的空間舉行。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問男子的身份，聆聽時不要錯過與身份及職業有關的詞彙語句。男子說「I'm still settling in here since it's my first day of work.」，提到這是他第一天上班，所以還在適應這裡。由此可知，男子是新進員工，所以正確答案是 (B) A new employee。","vocabulary":""},{"id":64,"part":3,"group":62,"correct":"D","audio":"audio/Test07_62-64.mp3","image":"images/62.jpg","stem":"Look at the graphic. Where is a meeting being held?","options":{"A":"In Room 1401","B":"In Room 1402","C":"In Room 1403","D":"In Room 1404"},"transcript":"M: Pardon me. 62 I'm supposed to participate in an orientation session organized by the human resources department. It should've sta sidered how to use a recent federal grant. Some people were hoping that the funds would be spent on road repairs. However, 87 a majority of residents support Mayor Sherry Keenam's decision to approve the library proposal. As of now, no fixed timeline regarding construction has been established, but work is expected to start as soon as this September. 88 To find out the latest details about this development moving forward, residents are welcome to take part in Town Hall meetings every Tuesday evening.","zhTranscript":"在週末，市政府官員宣布計畫分配 200 萬元來建造新的公立圖書館。這項決議經過幾星期的辯論而做出來，期間市議員考慮要如何使用最近的政府補助金。有些人希望資金可以用在道路修補。然而，87 大多數的居民支持 Sherry Keenam 市長批准圖書館提案的決定。目前還沒有確定這項工程建造的具體時間表，但工程預計盡快在今年九月開始。88 想知道關於開發案的最新資訊，歡迎居民參加每週二晚上的市民大會。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問聽者可以如何更了解計畫，所以要仔細聆聽與題目關鍵語句（learn more about a project）有關的內容。獨白說「To find out the latest details about this development moving forward, residents are welcome to take part in Town Hall meetings every Tuesday evening.」，提到想知道關於開發案的最新資訊，歡迎居民每週二晚上參加市民大會，所以正確答案是 (D) By attending some meetings。","vocabulary":""},{"id":89,"part":4,"group":89,"correct":"A","audio":"audio/Test07_89-91.mp3","image":"","stem":"What problem is mentioned?","options":{"A":"Sales for a line have dropped.","B":"A battery will not charge properly.","C":"Car models received bad press.","D":"A recall must be carried out."},"transcript":"While we have achieved record sales numbers for many of our products this year, car batteries have been an exception. Until recently, our line of automotive batteries was popular among consumers. 89 However, it is now underperforming as more competitors have entered the market. As a result, management has decided to drop the A34 car battery model to reduce production costs. 90 The impact is expected to be considerable. As for models that will remain in production, 91 we'll be sending out an updated product catalog to retail outlets at the end of next week.","zhTranscript":"儘管我們今年許多產品都達到創紀錄的銷售數字，汽車電池一直是例外。直到最近，我們的汽車電池種類在消費者之間很受歡迎。89 然而，現在表現平平，因為更多競爭業者進入市場。因此，管理層決定放棄 A34 汽車電池型號以降低生產成本。90 這將是相當大的影響。至於將繼續維持生產的型號，91 我們會在下週末寄出更新的商品型錄給零售商。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者提到的問題，所以要仔細聆聽獨白中與題目關鍵詞（problem）有關的內容。獨白說「Until recently, our line of automotive batteries was popular among consumers. However, it is now underperforming」，提到直到最近自己公司汽車電池種類在消費者之間很受歡迎，然而現在表現平平。由此可知，有一種商品種類的銷售量下降，所以正確答案是 (A) Sales for a line have dropped。","vocabulary":"record [ˈrɛkɚd] 創紀錄的；exception [ɪkˈsɛpʃən] 例外；line [laɪn]（商品）種類；underperform [ˌʌndɚpɚˈfɔrm] 表現平平；competitor [kəmˈpɛtɪtɚ] 競爭業者；drop [drɑp] 放棄；charge [tʃɑrdʒ] 充電；press [prɛs] 報刊評論；recall [rɪˈkɔl] 召回；benefit [ˈbɛnəfɪt] 獲益；merge [mɝdʒ] 合併；go into effect 開始生效；forecast [ˈfɔrˌkæst] 預測；commercial [kəˈmɝʃəl] 廣告"},{"id":90,"part":4,"group":89,"correct":"D","audio":"audio/Test07_89-91.mp3","image":"","stem":"What does the speaker imply when he says, \"The impact is expected to be considerable\"?","options":{"A":"A factory will bring in additional workers.","B":"A business will benefit from a merger.","C":"A schedule change will go into effect today.","D":"A production strategy will save money."},"transcript":"While we have achieved record sales numbers for many of our products this year, car batteries have been an exception. Until recently, our line of automotive batteries was popular among consumers. 89 However, it is now underperforming as more competitors have entered the market. As a result, management has decided to drop the A34 car battery model to reduce production costs. 90 The impact is expected to be considerable. As for models that will remain in production, 91 we'll be sending out an updated product catalog to retail outlets at the end of next week.","zhTranscript":"儘管我們今年許多產品都達到創紀錄的銷售數字，汽車電池一直是例外。直到最近，我們的汽車電池種類在消費者之間很受歡迎。89 然而，現在表現平平，因為更多競爭業者進入市場。因此，管理層決定放棄 A34 汽車電池型號以降低生產成本。90 這將是相當大的影響。至於將繼續維持生產的型號，91 我們會在下週末寄出更新的商品型錄給零售商。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者說某句話的意圖，所以要仔細聆聽提及題目引用句（The impact is expected to be considerable）的前後內容。獨白說「As a result, management has decided to drop the A34 car battery model to reduce production costs.」，提到管理層決定放棄 A34 汽車電池型號以降低生產成本，接著又說「The impact is expected to be considerable.」，提到這將是相當大的影響。由此可知，這句話是為了表示放棄一個電池型號的生產策略將會省錢，所以正確答案是 (D) A production strategy will save money。","vocabulary":""},{"id":91,"part":4,"group":89,"correct":"A","audio":"audio/Test07_89-91.mp3","image":"","stem":"What will be sent out next week?","options":{"A":"A catalog","B":"A sales forecast","C":"A product","D":"A radio commercial"},"transcript":"While we have achieved record sales numbers for many of our products this year, car batteries have been an exception. Until recently, our line of automotive batteries was popular among consumers. 89 However, it is now underperforming as more competitors have entered the market. As a result, management has decided to drop the A34 car battery model to reduce production costs. 90 The impact is expected to be considerable. As for models that will remain in production, 91 we'll be sending out an updated product catalog to retail outlets at the end of next week.","zhTranscript":"儘管我們今年許多產品都達到創紀錄的銷售數字，汽車電池一直是例外。直到最近，我們的汽車電池種類在消費者之間很受歡迎。89 然而，現在表現平平，因為更多競爭業者進入市場。因此，管理層決定放棄 A34 汽車電池型號以降低生產成本。90 這將是相當大的影響。至於將繼續維持生產的型號，91 我們會在下週末寄出更新的商品型錄給零售商。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問下週將發送什麼，所以要仔細聆聽獨白中與題目關鍵語句（sent out next week）有關的內容。獨白說「we'll be sending out an updated product catalog to retail outlets at the end of next week」，提到將在下週末寄送更新的產品型錄給零售商，所以正確答案是 (A) A catalog。","vocabulary":""},{"id":92,"part":4,"group":92,"correct":"B","audio":"audio/Test07_92-94.mp3","image":"","stem":"What will the speaker discuss first?","options":{"A":"Reasons for using training manuals","B":"Ways for making a workplace pleasant","C":"Methods for recruiting personnel","D":"Benefits of working fewer hours"},"transcript":"It's my pleasure to welcome you all to this workshop on how to improve interpersonal communication within office settings. Over the course of the morning, we'll be talking about a lot of very useful information. 92 First, I'll explain how to encourage personnel to be more engaged and communicative by creating a welcoming working environment. Then, later this morning, 93 we'll discuss a variety of group exercises that you can have employees do to build trust among team members—something essential to good communication. But before all of that, 94 I'd like everyone to quickly tell the group your name and a few details about where you work. Let's start over here on the left.","zhTranscript":"我很高興來歡迎大家參加這場關於如何改善辦公室環境人際溝通的工作坊。在今天上午的課程，我們會談到許多非常實用的資訊。92 首先，我會說明如何透過創造受歡迎的工作環境，以鼓勵員工更投入並樂於溝通。接著，早上稍晚，93 我們會討論各式各樣你可以讓員工做的團體活動，來建立團隊成員之間的信任，這對良好溝通非常重要。但在那之前，94 我希望大家快速告訴小組自己的名字和一些關於你在哪裡工作的細節。讓我們從左邊這裡開始。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者首先會討論什麼，所以要仔細聆聽獨白中與題目關鍵語句（discuss first）有關的內容。獨白說「First, I'll explain how to encourage personnel to be more engaged and communicative by creating a welcoming working environment.」，提到首先將說明透過創造受歡迎的工作環境來鼓勵員工更投入並樂於溝通的方法，所以正確答案是 (B) Ways for making a workplace pleasant。","vocabulary":"interpersonal [ˌɪntɚˈpɝsənḷ] 人際關係的；setting [ˈsɛtɪŋ] 環境；personnel [ˌpɝsṇˈɛl] 員工；engaged [ɪnˈɡedʒd] 投入的；welcoming [ˈwɛlkəmɪŋ] 歡迎的；essential [ɪˈsɛnʃəl] 必要的；detail [ˈditet] 細節；recruit [rɪˈkrut] 招募；auditorium [ˌɔdəˈtorɪəm] 禮堂；aim [em] 旨在；free [fri] 空的；refer to 參考；pair [pɛr] 一對"},{"id":93,"part":4,"group":92,"correct":"D","audio":"audio/Test07_92-94.mp3","image":"","stem":"What does the speaker mention about some group exercises?","options":{"A":"They are no longer open for registration.","B":"They will take place in an auditorium.","C":"They had to be delayed by an hour.","D":"They are aimed at improving trust."},"transcript":"It's my pleasure to welcome you all to this workshop on how to improve interpersonal communication within office settings. Over the course of the morning, we'll be talking about a lot of very useful information. 92 First, I'll explain how to encourage personnel to be more engaged and communicative by creating a welcoming working environment. Then, later this morning, 93 we'll discuss a variety of group exercises that you can have employees do to build trust among team members—something essential to good communication. But before all of that, 94 I'd like everyone to quickly tell the group your name and a few details about where you work. Let's start over here on the left.","zhTranscript":"我很高興來歡迎大家參加這場關於如何改善辦公室環境人際溝通的工作坊。在今天上午的課程，我們會談到許多非常實用的資訊。92 首先，我會說明如何透過創造受歡迎的工作環境，以鼓勵員工更投入並樂於溝通。接著，早上稍晚，93 我們會討論各式各樣你可以讓員工做的團體活動，來建立團隊成員之間的信任，這對良好溝通非常重要。但在那之前，94 我希望大家快速告訴小組自己的名字和一些關於你在哪裡工作的細節。讓我們從左邊這裡開始。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者提到什麼關於團體活動的資訊，所以要仔細聆聽與題目關鍵語句（group exercises）有關的內容。獨白說「we'll discuss a variety of group exercises that you can have employees do to build trust among team members」，提到將討論聽者可以讓員工做的各種團體活動，來建立團隊成員之間的信任。由此可知，團體活動旨在提升信任，所以正確答案是 (D) They are aimed at improving trust。","vocabulary":""},{"id":94,"part":4,"group":92,"correct":"B","audio":"audio/Test07_92-94.mp3","image":"","stem":"What does the speaker ask the listeners to do?","options":{"A":"Find a free seat","B":"Introduce themselves","C":"Refer to a handout","D":"Break up into pairs"},"transcript":"It's my pleasure to welcome you all to this workshop on how to improve interpersonal communication within office settings. Over the course of the morning, we'll be talking about a lot of very useful information. 92 First, I'll explain how to encourage personnel to be more engaged and communicative by creating a welcoming working environment. Then, later this morning, 93 we'll discuss a variety of group exercises that you can have employees do to build trust among team members—something essential to good communication. But before all of that, 94 I'd like everyone to quickly tell the group your name and a few details about where you work. Let's start over here on the left.","zhTranscript":"我很高興來歡迎大家參加這場關於如何改善辦公室環境人際溝通的工作坊。在今天上午的課程，我們會談到許多非常實用的資訊。92 首先，我會說明如何透過創造受歡迎的工作環境，以鼓勵員工更投入並樂於溝通。接著，早上稍晚，93 我們會討論各式各樣你可以讓員工做的團體活動，來建立團隊成員之間的信任，這對良好溝通非常重要。但在那之前，94 我希望大家快速告訴小組自己的名字和一些關於你在哪裡工作的細節。讓我們從左邊這裡開始。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問聽者被要求做什麼，所以要仔細聆聽獨白的後半部包含要求相關句型的內容。獨白說「I'd like everyone to quickly tell the group your name and a few details about where you work」，提到希望聽者迅速告訴小組名字與工作地點相關的細節，所以正確答案是 (B) Introduce themselves。","vocabulary":""},{"id":95,"part":4,"group":95,"correct":"C","audio":"audio/Test07_95-97.mp3","image":"images/95.jpg","stem":"Look at the graphic. When does the speaker want to schedule a book signing?","options":{"A":"On Monday","B":"On Tuesday","C":"On Wednesday","D":"On Thursday"},"transcript":"Mr. Hakeem, this is your assistant Peggy. I'm calling because the manager of Westwood Books wants to schedule a signing event to coincide with the release of your memoir. I know you're very busy next week, but 95 I think it would be best to schedule the event on the same day as the awards ceremony. 96 The hotel where the ceremony is being held is only a 10-minute drive from the bookstore, so you could easily do both. 97 I can arrange for a taxi to pick you up, so you won't have to worry about driving yourself. If you agree with my suggestions, I'll take care of everything.","zhTranscript":"Hakeem 先生，我是您的助理 Peggy。我打電話是因為 Westwood 書店的經理想要配合您回憶錄發行，安排簽名活動。我知道您下週很忙，但是 95 我認為最好將活動安排在頒獎典禮的同一天。96 舉行典禮的飯店離書店開車只要十分鐘，所以你可以輕鬆進行這兩個活動。97 我可以安排計程車接送您，所以您不必擔心自己開車。如果您同意我的建議，我會把每件事處理好。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者想在何時安排簽名活動，所以要先確認題目提供的行事曆資料，接著仔細聆聽與題目關鍵語句（schedule a book signing）有關的內容。獨白說「I think it would be best to schedule the event [signing event] on the same day as the awards ceremony」，提到最好將活動安排在頒獎典禮的同一天。對照行事曆資料可知，說話者希望將簽名活動安排在預定舉辦頒獎典禮的星期三，所以正確答案是 (C) On Wednesday。","vocabulary":"memoir [ˈmɛmwɑr] 回憶錄；coincide with 與～同時發生；ceremony [ˈsɛrəˌmonɪ] 典禮；itinerary [aɪˈtɪnəˌrɛrɪ] 旅行計畫；accommodation [əˌkɑməˈdeʃən] 住宿"},{"id":96,"part":4,"group":95,"correct":"B","audio":"audio/Test07_95-97.mp3","image":"images/95.jpg","stem":"What is located near the bookstore?","options":{"A":"A convention center","B":"A hotel","C":"An airport","D":"A company headquarters"},"transcript":"Mr. Hakeem, this is your assistant Peggy. I'm calling because the manager of Westwood Books wants to schedule a signing event to coincide with the release of your memoir. I know you're very busy next week, but 95 I think it would be best to schedule the event on the same day as the awards ceremony. 96 The hotel where the ceremony is being held is only a 10-minute drive from the bookstore, so you could easily do both. 97 I can arrange for a taxi to pick you up, so you won't have to worry about driving yourself. If you agree with my suggestions, I'll take care of everything.","zhTranscript":"Hakeem 先生，我是您的助理 Peggy。我打電話是因為 Westwood 書店的經理想要配合您回憶錄發行，安排簽名活動。我知道您下週很忙，但是 95 我認為最好將活動安排在頒獎典禮的同一天。96 舉行典禮的飯店離書店開車只要十分鐘，所以你可以輕鬆進行這兩個活動。97 我可以安排計程車接送您，所以您不必擔心自己開車。如果您同意我的建議，我會把每件事處理好。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問什麼位於書店附近，所以要仔細聆聽獨白中與題目關鍵語句（near the bookstore）有關的內容。獨白說「The hotel where the ceremony is being held is only a 10-minute drive from the bookstore」，提到舉行典禮的飯店離書店只要十分鐘的車程，所以正確答案是 (B) A hotel。","vocabulary":""},{"id":97,"part":4,"group":95,"correct":"D","audio":"audio/Test07_95-97.mp3","image":"images/95.jpg","stem":"What does the speaker offer to do?","options":{"A":"Call a bookstore","B":"Send an itinerary","C":"Provide accommodation","D":"Arrange transportation"},"transcript":"Mr. Hakeem, this is your assistant Peggy. I'm calling because the manager of Westwood Books wants to schedule a signing event to coincide with the release of your memoir. I know you're very busy next week, but 95 I think it would be best to schedule the event on the same day as the awards ceremony. 96 The hotel where the ceremony is being held is only a 10-minute drive from the bookstore, so you could easily do both. 97 I can arrange for a taxi to pick you up, so you won't have to worry about driving yourself. If you agree with my suggestions, I'll take care of everything.","zhTranscript":"Hakeem 先生，我是您的助理 Peggy。我打電話是因為 Westwood 書店的經理想要配合您回憶錄發行，安排簽名活動。我知道您下週很忙，但是 95 我認為最好將活動安排在頒獎典禮的同一天。96 舉行典禮的飯店離書店開車只要十分鐘，所以你可以輕鬆進行這兩個活動。97 我可以安排計程車接送您，所以您不必擔心自己開車。如果您同意我的建議，我會把每件事處理好。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者主動提出做什麼，所以要仔細聆聽獨白的後半部包含建議相關語句的內容。獨白說「I can arrange for a taxi to pick you up」，提到自己可以安排計程車接送聽者，所以正確答案是 (D) Arrange transportation。","vocabulary":""},{"id":98,"part":4,"group":98,"correct":"B","audio":"audio/Test07_98-100.mp3","image":"images/98.jpg","stem":"What did the listener do last week?","options":{"A":"Decorated a lobby","B":"Attended a meeting","C":"Purchased some items","D":"Provided some samples"},"transcript":"Hello, Ms. Coyle. This is Sandra Brink. I want to let you know that I've come to a decision regarding our lobby arrangement. 98 I like the idea that you shared during our meeting last week about placing a table in the center of the room. Clients will appreciate having a place to set down their belongings as they wait to meet with staff. 99 I also contacted my partner Marvin Griggs to get his input, and 100 we agree that the design with a small chair and two long sofas facing each other is the most ideal one. You have my permission to order the appropriate furniture in the fabric styles we discussed before.","zhTranscript":"您好，Coyle 女士。我是 Sandra Brink。我想讓您知道，我已經決定關於我們大廳的布置了。98 我喜歡您在上週會議分享關於將一張桌子放在房間中央的想法。客戶會很感謝在他們等待與工作人員見面時，有地方可以放置他們的隨身物品。99 我也聯絡我的合夥人 Marvin Griggs 以得到他的建議，而 100 我們同意一張小椅子與兩張長沙發面對面的設計最理想。您有我的許可照我們先前討論過的布料風格訂購適合的家具。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問聽者上週做了什麼，所以要仔細聆聽提到題目關鍵語句（last week）的前後內容。獨白說「I like the idea that you shared during our meeting last week」，提到喜歡聽者在上週會議上分享的想法。由此可知，聽者上週參加會議，所以正確答案是 (B) Attended a meeting。","vocabulary":"lobby [ˈlɑbɪ] 大廳；arrangement [əˈrendʒmənt] 布置；belongings [bɪˈlɔŋɪŋz] 隨身物品；input [ˈɪnˌpʊt] 建議；ideal [aɪˈdiəl] 理想的；permission [pɚˈmɪʃən] 許可；appropriate [əˈproprɪɪt] 適合的；fabric [ˈfæbrɪk] 布料"},{"id":99,"part":4,"group":98,"correct":"D","audio":"audio/Test07_98-100.mp3","image":"images/98.jpg","stem":"Why did the speaker contact Marvin Griggs?","options":{"A":"To explain a delay","B":"To ask about a deadline","C":"To request a change","D":"To get an opinion"},"transcript":"Hello, Ms. Coyle. This is Sandra Brink. I want to let you know that I've come to a decision regarding our lobby arrangement. 98 I like the idea that you shared during our meeting last week about placing a table in the center of the room. Clients will appreciate having a place to set down their belongings as they wait to meet with staff. 99 I also contacted my partner Marvin Griggs to get his input, and 100 we agree that the design with a small chair and two long sofas facing each other is the most ideal one. You have my permission to order the appropriate furniture in the fabric styles we discussed before.","zhTranscript":"您好，Coyle 女士。我是 Sandra Brink。我想讓您知道，我已經決定關於我們大廳的布置了。98 我喜歡您在上週會議分享關於將一張桌子放在房間中央的想法。客戶會很感謝在他們等待與工作人員見面時，有地方可以放置他們的隨身物品。99 我也聯絡我的合夥人 Marvin Griggs 以得到他的建議，而 100 我們同意一張小椅子與兩張長沙發面對面的設計最理想。您有我的許可照我們先前討論過的布料風格訂購適合的家具。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者聯絡 Marvin Griggs 的原因，所以要仔細聆聽提到題目關鍵語句（contact Marvin Griggs）的前後內容。獨白說「I also contacted my partner Marvin Griggs to get his input」，提到聯絡自己的合夥人 Marvin Griggs 以得到他的建議，所以正確答案是 (D) To get an opinion。","vocabulary":""},{"id":100,"part":4,"group":98,"correct":"C","audio":"audio/Test07_98-100.mp3","image":"images/98.jpg","stem":"Look at the graphic. Which option does the speaker prefer?","options":{"A":"Layout 1","B":"Layout 2","C":"Layout 3","D":"Layout 4"},"transcript":"Hello, Ms. Coyle. This is Sandra Brink. I want to let you know that I've come to a decision regarding our lobby arrangement. 98 I like the idea that you shared during our meeting last week about placing a table in the center of the room. Clients will appreciate having a place to set down their belongings as they wait to meet with staff. 99 I also contacted my partner Marvin Griggs to get his input, and 100 we agree that the design with a small chair and two long sofas facing each other is the most ideal one. You have my permission to order the appropriate furniture in the fabric styles we discussed before.","zhTranscript":"您好，Coyle 女士。我是 Sandra Brink。我想讓您知道，我已經決定關於我們大廳的布置了。98 我喜歡您在上週會議分享關於將一張桌子放在房間中央的想法。客戶會很感謝在他們等待與工作人員見面時，有地方可以放置他們的隨身物品。99 我也聯絡我的合夥人 Marvin Griggs 以得到他的建議，而 100 我們同意一張小椅子與兩張長沙發面對面的設計最理想。您有我的許可照我們先前討論過的布料風格訂購適合的家具。","zhQuestion":"","zhOptions":{},"analysis":"題目詢問說話者偏好哪個選項，所以要先確認題目提供的布局圖表資料，接著仔細聆聽與題目關鍵語句（option ~ speaker prefer）有關的內容。獨白說「we agree that the design with a small chair and two long sofas facing each other is the most ideal one」，提到同意一張小椅子和兩張長沙發面對面是最理想的設計。對照配置圖資料可知，說話者偏好的是布局 3，所以正確答案是 (C) Layout 3。","vocabulary":""}]<!doctype html>
