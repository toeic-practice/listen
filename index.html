<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 多益聽力線上練習｜首頁</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#1b3153;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:linear-gradient(135deg,#152b50,#356ab8);color:white;padding:40px 20px}header>div,main{max-width:1000px;margin:auto}h1{font-size:clamp(24px,5vw,38px);margin:6px 0}header p{color:#dce9ff;max-width:590px}.sub{margin:28px 0 15px;color:#667890;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border:1px solid #dbe3ef;border-radius:17px;padding:20px}.card h2{margin:0 0 4px;font-size:20px}.card p{font-size:13px;color:#60748e}.badge{font-size:12px;background:#ecf2fc;color:#2c5a9e;padding:5px 9px;border-radius:9px}.btn{display:inline-block;padding:10px 16px;background:#2765c9;color:white;text-decoration:none;font-weight:700;border-radius:10px}.muted{background:#e6eaf1;color:#7b8696;pointer-events:none}main{padding:0 17px 45px}footer{text-align:center;color:#7b8ca2;border-top:1px solid #dce5f1;padding:26px;font-size:12px}@media(max-width:690px){.grid{grid-template-columns:1fr}} </style><header><div><small>🎧 TOEIC LISTENING PRACTICE</small><h1>多益聽力線上練習</h1><p>Part 1 照片描述｜Part 2 應答問題｜Part 3 簡短對話｜Part 4 簡短獨白。逐題 MP3、作答後翻譯與解題、標記及錯題複習。</p></div></header><main><h2>選擇聽力練習回次</h2><div class="sub">每回 100 題・10 回規劃中</div><div class="grid" id="grid"></div><p class="sub">第一回的音檔存放於 Part01/audio，照片與題本截圖存放於 Part01/images；解析原稿截圖存放於 Part01/solutions。網站只供有權使用該教材者練習，非 ETS 官方網站。</p></main><footer>TOEIC 多益線上練習｜聽力</footer><script>const g=document.getElementById('grid');for(let n=1;n<=10;n++){const z=String(n).padStart(2,'0');const el=document.createElement('article');el.className='card';el.innerHTML='<span class="badge">'+(n===1?'第一回已建立':'製作中')+'</span><h2>第 '+n+' 回 Listening Test</h2><p>100 題｜MP3 播放｜答案解析｜標記與錯題練習</p><a class="btn '+(n===1?'':'muted')+'" href="Part'+z+'/index.html">'+(n===1?'進入一般練習 →':'尚未上架')+'</a>';g.appendChild(el)}</script></html>
