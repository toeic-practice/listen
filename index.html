<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#103e32">
<title>TOEIC 多益聽力練習中心｜第 1～10 回</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#193b31;background:#f0f6f2;line-height:1.6}*{box-sizing:border-box}body{margin:0}.container{max-width:1050px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(120deg,#103e32,#28745c);color:#fff;border-radius:18px;padding:36px 30px;border-bottom:6px solid #eab94e}.hero h1{font-size:clamp(26px,4vw,38px);margin:0 0 9px}.hero p{margin:0;color:#dcf4e7;font-size:16px}.intro{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 14px}.intro h2{font-size:21px;margin:0}.intro span{color:#677e72;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chapter{background:#fff;border:1px solid #d7e7dd;border-radius:14px;padding:23px;display:flex;flex-direction:column;gap:11px;box-shadow:0 5px 18px #143c2b0a}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.chapter h3{margin:0;font-size:23px;color:#16513f}.badge{font-size:12px;border-radius:20px;padding:4px 10px;background:#f0f4f1;color:#667b70;white-space:nowrap}.badge.ready{background:#dff4e9;color:#146445}.desc{margin:0;color:#597368;font-size:14px;min-height:23px}.action{display:block;text-align:center;text-decoration:none;background:#16694f;color:white;border-radius:9px;font-size:15px;font-weight:700;padding:12px 16px;transition:background .18s}.action:hover{background:#0d4937}.action.disabled{background:#e8eee9;color:#7d8a81;cursor:not-allowed}.note{background:#fff;border:1px solid #d7e7dd;border-radius:12px;padding:17px 20px;margin-top:24px;color:#516a5b;font-size:14px}.note strong{color:#215541}.footer{text-align:center;margin-top:24px;color:#7c9385;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:27px 21px}.container{padding:14px 12px 36px}.intro{align-items:start;flex-direction:column;gap:2px}.chapter{padding:19px}}
</style>
</head>
<body>
<main class="container">
<header class="hero"><h1>TOEIC 多益聽力線上練習中心</h1><p>選擇練習回次｜MP3 聽力播放・中英文逐字稿・錯題複習・作答紀錄</p></header>
<section class="intro"><h2>選擇練習回次</h2><span>第 1～10 回</span></section>
<section class="grid" id="chapterGrid" aria-label="聽力練習回次列表"></section>
<section class="note"><strong>使用說明：</strong>點選已開放的回次即可開始作答。每回可在題目頁輸入使用者代號，不輸入時使用本機模式；第 1、2 回已建置題庫頁面；第 2 回圖片及 MP3 尚待補齊。第 3～10 回已開放進入，但目前僅顯示待建置說明，尚無題目可作答。作答紀錄依各回頁面的 Firebase 驗證及同步狀態運作。</section>
<footer class="footer">TOEIC 聽力練習中心｜自主練習使用</footer>
</main>
<script>
// 章節管理：新回次完成並上傳 index.html 後，再將 available 改為 true。
const CHAPTERS = [
  {number:1, title:'第 1 回', description:'完整聽力題庫・100 題', path:'Part01/', available:true},
  {number:2, title:'第 2 回', description:'完整聽力題庫・100 題（圖片與 MP3 待補）', path:'Part02/', available:true},
  {number:3, title:'第 3 回', description:'題庫建置中・目前提供入口與說明', path:'Part03/', available:true},
  {number:4, title:'第 4 回', description:'題庫建置中・目前提供入口與說明', path:'Part04/', available:true},
  {number:5, title:'第 5 回', description:'題庫建置中・目前提供入口與說明', path:'Part05/', available:true},
  {number:6, title:'第 6 回', description:'題庫建置中・目前提供入口與說明', path:'Part06/', available:true},
  {number:7, title:'第 7 回', description:'題庫建置中・目前提供入口與說明', path:'Part07/', available:true},
  {number:8, title:'第 8 回', description:'題庫建置中・目前提供入口與說明', path:'Part08/', available:true},
  {number:9, title:'第 9 回', description:'題庫建置中・目前提供入口與說明', path:'Part09/', available:true},
  {number:10, title:'第 10 回', description:'題庫建置中・目前提供入口與說明', path:'Part10/', available:true}
];
const grid=document.getElementById('chapterGrid');
for(const item of CHAPTERS){
  const card=document.createElement('article');card.className='chapter';
  const top=document.createElement('div');top.className='top';
  const title=document.createElement('h3');title.textContent=item.title;
  const badge=document.createElement('span');badge.className='badge'+(item.available?' ready':'');badge.textContent=item.available?'已開放':'尚未開放';
  top.append(title,badge);
  const description=document.createElement('p');description.className='desc';description.textContent=item.description;
  const action=document.createElement(item.available?'a':'span');action.className='action'+(item.available?'':' disabled');action.textContent=item.available?'進入練習 →':'敬請期待';
  if(item.available)action.href=item.path;
  card.append(top,description,action);grid.append(card);
}
</script>
</body>
</html>
